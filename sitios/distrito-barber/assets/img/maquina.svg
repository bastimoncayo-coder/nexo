<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Máquina de cortar pelo. Ilustración original para Distrito Barber (demo de Estudio Norte). -->
  <defs>
    <pattern id="trama" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#111111" fill-opacity=".22"/>
    </pattern>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset=".35" stop-color="#111111"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="98" fill="url(#trama)"/>
  <g transform="rotate(14 120 130)">
    <!-- cable -->
    <path d="M120 214 C120 232 150 230 170 236 C186 240 196 236 206 240" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <!-- sombra -->
    <path d="M90 74 L162 74 L170 202 C170 216 158 224 144 224 L108 224 C94 224 82 216 82 202 Z" fill="#111111" opacity=".22"/>
    <!-- cuerpo -->
    <path d="M84 68 L156 68 L164 196 C164 210 152 218 138 218 L102 218 C88 218 76 210 76 196 Z" fill="url(#cuerpo)"/>
    <path d="M81 116 L159 116 L160.3 136 L79.8 136 Z" fill="#F5C518"/>
    <path d="M92 80 L88 190" stroke="#F2EFE8" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
    <!-- interruptor -->
    <rect x="108" y="150" width="24" height="44" rx="12" fill="#2E2E2E" stroke="#F2EFE8" stroke-width="2"/>
    <circle cx="120" cy="164" r="7" fill="#F2EFE8"/>
    <!-- cabezal -->
    <rect x="76" y="50" width="88" height="22" rx="4" fill="#F2EFE8" stroke="#111111" stroke-width="4"/>
    <path d="M80 50 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12 l4 -12 l4 12" fill="#F2EFE8" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86 61 L154 61" stroke="#111111" stroke-width="2" stroke-opacity=".5"/>
  </g>
</svg>
