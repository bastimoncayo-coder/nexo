<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Retrato gráfico ficticio: Nico. Ilustración original para Distrito Barber (demo de Estudio Norte). -->
  <defs>
    <pattern id="reticula" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#111111" stroke-opacity=".12" stroke-width="1.5"/>
    </pattern>
    <pattern id="barbita" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#2B1D14" fill-opacity=".6"/>
    </pattern>
    <radialGradient id="luz" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#F2EFE8"/>
  <rect width="400" height="500" fill="url(#reticula)"/>
  <circle cx="200" cy="236" r="152" fill="#F5C518"/>
  <!-- polera -->
