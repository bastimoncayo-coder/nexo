    <circle cx="186" cy="116" r="22"/><circle cx="214" cy="114" r="22"/><circle cx="242" cy="124" r="22"/>
    <circle cx="264" cy="146" r="20"/><circle cx="276" cy="174" r="18"/><circle cx="152" cy="166" r="16"/>
    <circle cx="178" cy="150" r="18"/><circle cx="206" cy="144" r="18"/><circle cx="232" cy="150" r="18"/>
    <circle cx="254" cy="168" r="15"/><circle cx="170" cy="170" r="11"/><circle cx="198" cy="166" r="12"/>
    <circle cx="226" cy="170" r="11"/>
